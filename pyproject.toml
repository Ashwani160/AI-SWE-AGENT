[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reporag"
version = "0.1.0"
description = "AI Software Engineering Assistant CLI"
requires-python = ">=3.10"
dependencies = [
    "requests"
]

[tool.setuptools.packages.find]
include = ["client*"]

[project.scripts]
reporag = "client.cli:run"